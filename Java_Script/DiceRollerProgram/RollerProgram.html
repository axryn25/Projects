<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller program</title>
    <link rel="StyleSheet" href="RollerProgram.css">
</head>
<body>
    <div class="center">
        <h1>Dice Roller</h1>
        <label style="font-size: larger;"># of Dice: </label>
        <input type="number" id="number" value="1" min="1" style="font-size: large;">
        <button id="roll" onclick="DiceRoll()">Roll Dice</button>
        <h2 id="Answer"></h2>
        <div id="pics"></div>
        
        
    </div>
</body>
<script src="RollerProgram.js"></script>
</html>
